name: macOS checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/files-table-inspector]

permissions:
  contents: read

concurrency:
  group: macos-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Model tests and universal build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run model tests
        run: swift test
      - name: Build for Apple silicon and Intel
        run: |
          xcodebuild -project app/Glade/Glade.xcodeproj \
            -scheme Glade -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/GladeDerivedData" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build
      - name: Clean temporary app registrations
        if: always()
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister
          if [ -d "$RUNNER_TEMP/GladeDerivedData" ]; then
            find "$RUNNER_TEMP/GladeDerivedData" -type d -name '*.app' \
              -exec "$lsregister" -u '{}' \; || true
            rm -rf "$RUNNER_TEMP/GladeDerivedData"
          fi
